name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: mcp-cmr24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            mcp-cmr24/requirements.lock
            mcp-cmr24/requirements-windows.lock
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: python -m pip install --require-hashes -r requirements-windows.lock
      - name: Install quality tools
        run: python -m pip install ruff bandit pip-audit
      - name: Ruff
        run: ruff check .
      - name: Security scan
        run: bandit -q -r . -x tests
      - name: Audit Linux dependencies
        if: runner.os == 'Linux'
        run: pip-audit -r requirements.lock
      - name: Audit Windows dependencies
        if: runner.os == 'Windows'
        run: pip-audit -r requirements-windows.lock
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Load smoke test
        run: python -m tests.load_test --requests 1000 --concurrency 50

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t cmr24-mcp:ci ./mcp-cmr24
